name: ScrollShot
options:
  bundleIdPrefix: com.scrollshot
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.8.84"
    CURRENT_PROJECT_VERSION: "160"
    DEVELOPMENT_LANGUAGE: zh-Hans
    # Apple Silicon only（2026-10-23 起放弃 Intel；DMG 体积 ~6.3MB → ~4MB）
    ARCHS: "arm64"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"   # 2.9.5/2.9.6 是安全修复,不允许再落到 2.9.4
  DDMathParser:
    url: https://github.com/davedelong/DDMathParser
    exactVersion: "3.1.0"
targets:
  ScrollShot:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: App
      - path: Capture
      - path: Overlay
      - path: Editor
      - path: Stitch
      - path: Selection
      - path: Preferences
      - path: DiskScan
      - path: KeyMapping
      - path: UsageMonitor
      - path: Clipboard
      - path: Launcher
      - path: LLM
      - path: Shelf
      - path: InputStats
      - path: SmartPaste
      - path: DisplayBrightness
      - path: MouseAccel
      - path: WindowTiling
      - path: SystemMonitor
      - path: DeviceBattery
      - path: KeyChatter
      - path: InputMethodIndicator
      - path: CableInfo
      - path: Analytics
      - path: AgentBridge
      - path: Notch
      - path: Resources/Assets.xcassets
      - path: Resources/RunnerCat
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
      - path: Resources/es.lproj
        buildPhase: resources
      - path: Resources/m1ddc
        buildPhase: resources
      - path: Resources/whatcable.db
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - package: DDMathParser
        product: MathParser
      - sdk: Carbon.framework
      - target: scrollshot-bridge
        embed: false
    postBuildScripts:
      # XcodeGen can't express "copy another target's built product" as a Copy
      # Files phase, so this script stage does the equivalent: place the bridge
      # binary at Contents/Helpers/scrollshot-bridge (runs before code signing,
      # so the bundle signature covers it).
      - name: Embed scrollshot-bridge
        script: |
          set -e
          HELPERS="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$HELPERS"
          ditto "$BUILT_PRODUCTS_DIR/scrollshot-bridge" "$HELPERS/scrollshot-bridge"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scrollshot.app
        PRODUCT_NAME: ScrollShot
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ScrollShot.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5QZY8FV25Y"   # 固定签名:屏幕录制等授权才能跨重新编译保留
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_TESTABILITY: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
  scrollshot-bridge:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Bridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scrollshot.bridge
        PRODUCT_NAME: scrollshot-bridge
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5QZY8FV25Y"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES   # tool target 不装档:否则 archive 多出 usr/local/bin 产品,Xcode 拒绝一切 export method
  ScrollShotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests
    dependencies:
      - target: ScrollShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scrollshot.tests
        DEVELOPMENT_TEAM: "5QZY8FV25Y"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path/../Frameworks"
